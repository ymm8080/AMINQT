# =============================================================================
# AMINQT AI PR Review — powered by GLM (Zhipu/BigModel)
# Model: glm-4.6 (Zhipu ChatGLM, OpenAI-compatible API)
# API key: stored as repo secret GLM_API_KEY
# Trigger: PR opened / synchronize / reopened + manual dispatch
# Legacy: also supports DEEPSEEK_API_KEY if GLM_API_KEY is absent
# =============================================================================
name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "rules/**"
      - "skills/**"
      - "prompts/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

concurrency:
  group: deepseek-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: GLM-4.6 Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI PR Review
        env:
          # GLM (Zhipu/BigModel) — primary provider
          LLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          LLM_MODEL: glm-4.6
          LLM_BASE_URL: https://open.bigmodel.cn/api/paas/v4
          LLM_PROVIDER: glm
          # Legacy fallback (used only if GLM_API_KEY is empty)
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # GitHub token for posting review comments
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: python scripts/deepseek_pr_review.py
