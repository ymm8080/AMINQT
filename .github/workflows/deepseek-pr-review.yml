# =============================================================================
# AMINQT AI PR Review — powered by OpenCode Go (DeepSeek V4.1 Flash)
# Model: deepseek-v4.1-flash via https://opencode.ai/zen/go/v1 (OpenAI wire)
# API key: stored as repo secret OPENCODE_API_KEY (user 0916 directive)
# Trigger: PR opened / synchronize / reopened + manual dispatch
# Fallbacks: GLM_API_KEY (glm-4.6) / DEEPSEEK_API_KEY if OPENCODE is absent
# =============================================================================
name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "rules/**"
      - "skills/**"
      - "prompts/**"
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

concurrency:
  group: deepseek-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: OpenCode-Go DeepSeek V4.1 Flash Review
    runs-on: ubuntu-latest
    # 网络瞬断重试 (3 次 + 退避) 最坏 ~16min, 10min 会在重试中途杀掉作业
    timeout-minutes: 20
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI PR Review
        env:
          # OpenCode Go (DeepSeek V4.1 Flash) — primary provider (user 0916 directive)
          LLM_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          LLM_MODEL: deepseek-v4.1-flash
          LLM_BASE_URL: https://opencode.ai/zen/go/v1
          LLM_PROVIDER: opencode
          # Legacy fallback (used only if GLM_API_KEY is empty)
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # GitHub token for posting review comments
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: python scripts/deepseek_pr_review.py
