# ══ DeepSeek LLM 配置 (P13, ARCH §5.20.3) ══
# API key 只存 .env (DEEPSEEK_API_KEY), 禁止写入本文件
deepseek:
  enabled: true
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"              # 复杂推理用 deepseek-reasoner
  v4_flash_model: "deepseek-v4-flash" # Claude Code sub-agent 模式
  timeout_sec: 10
  daily_token_limit: 500000           # 日限额熔断
  cache_ttl: "market_close"           # 当日有效
  features:                           # 12 项独立开关
    explain_signal: true
    sentiment: true
    factor_hypothesis: true
    diagnose: true
    sentiment_index: true
    dragon_tiger: true
    northbound: true
    concept_graph: true
    similar_kline: true
    block_trade: true
    order_book: true
    ai_report: true

# ══ Claude Code Sub-Agent (MCP) ══
# 通过 MCP 协议暴露为 Claude Code 可调用的工具集
# 详见 docs/agents/deepseek-sub-agent.md
sub_agent:
  enabled: true
  mcp_server: "deepseek-sub-agent"
  transport: "stdio"
  register_in: ".claude/mcp.json"
  tools:
    - deepseek_ask
    - deepseek_review_code
    - deepseek_analyze_sentiment
    - deepseek_explain_signal
    - deepseek_factor_hypothesis
    - deepseek_diagnose